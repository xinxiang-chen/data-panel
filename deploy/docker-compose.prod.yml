# Production stack for one small VM: TimescaleDB + backend + Caddy (HTTPS).
# The frontend runs on Vercel and calls https://$DOMAIN server-side.
#
# On the server, from this directory:
#   cp .env.example .env              # then fill in DOMAIN, POSTGRES_PASSWORD, API_TOKEN
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend python -m scripts.seed --days 90
#
# Only Caddy publishes ports. The database and backend are reachable only on
# the compose network, so the API is exposed solely over HTTPS via Caddy.
name: data-panel

services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: sensor_sim
    volumes:
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensor_sim"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # Built on the server for now; CD will switch BACKEND_IMAGE to a GHCR tag.
    build: ../backend
    image: ${BACKEND_IMAGE:-data-panel-backend:local}
    restart: unless-stopped
    environment:
      APP_ENV: production # refuses to start with a weak API_TOKEN
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/sensor_sim
      PROJECT_ID: ${PROJECT_ID:-demo}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in deploy/.env}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep across restarts
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
